name: Deploy

on:
  push:
    branches:
      - main   # Requirement 9.1

jobs:
  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    # This job needs container-registry credentials (the REGISTRY_URL,
    # REGISTRY_USERNAME, and REGISTRY_PASSWORD secrets). Without them
    # docker/login-action fails the run on every push to main. Gate the job on
    # an opt-in repo variable so it is cleanly skipped until deployment is set
    # up: add the three secrets, then set the DEPLOY_ENABLED repository variable
    # to "true" (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        # Requirement 9.3: authenticate before any push; job fails immediately on error
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract git SHA tag
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # ── Build and push apps/server ──────────────────────────────────────────
      # Requirement 9.4: if server build fails, web image step never runs
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          # Requirement 9.5: tag with full git SHA and latest
          tags: |
            ${{ secrets.REGISTRY_URL }}/kb/server:${{ steps.meta.outputs.sha }}
            ${{ secrets.REGISTRY_URL }}/kb/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build and push apps/web ─────────────────────────────────────────────
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Requirement 9.5: tag with full git SHA and latest
          tags: |
            ${{ secrets.REGISTRY_URL }}/kb/web:${{ steps.meta.outputs.sha }}
            ${{ secrets.REGISTRY_URL }}/kb/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
