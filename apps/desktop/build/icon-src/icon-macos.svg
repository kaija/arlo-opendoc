<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Arlo Doc">
  <title>Arlo Doc - macOS</title>
  <!--
    macOS (.icns) art, 48px and up. Apple's Big Sur grid: 824x824 tile at
    (100,100) in a 1024 canvas, radius 185.4, shadow baked in because macOS
    masks nothing and adds no shadow of its own.
  -->
  <defs>
    <filter id="ad-shadow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1a1a2e" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a1a2e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#ad-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#5856D6"/>
  </g>
  <g transform="translate(512 512) scale(20.23) translate(-12 -12)"
     fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
      <path d="M14 2v6h6"/>
    </g>
    <g stroke-width="2.0">
      <path d="M8.4 18.3 12 9.9l3.6 8.4"/>
      <path d="M9.5 15.7h5"/>
    </g>
  </g>
</svg>
