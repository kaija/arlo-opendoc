appId: com.arlo.doc
productName: Arlo Doc
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist-electron

files:
  - out/**/*
  - package.json

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-setup.${ext}"
  shortcutName: "${productName}"
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: always

dmg:
  artifactName: "${productName}-${version}.${ext}"

publish: null

# Code signing placeholders (populated via CI secrets)
# mac: certificate loaded from APPLE_CERT_BASE64 secret in CI
# win: certificate decoded from WINDOWS_CERT_BASE64 secret in CI
# In CI, override publish: [{provider: github, releaseType: release}]
